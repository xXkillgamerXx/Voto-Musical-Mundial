map $http_cf_connecting_ip $vote_client_ip {
    "" $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 40m;

    charset utf-8;

    # Whole wp-content tree at the original public URLs (uploads, logos, webp, etc.).
    location ^~ /en/wp-content/ {
        alias /wp-en-content/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        error_page 404 = @en_wp_es;
    }
    location ^~ /es/wp-content/ {
        rewrite ^/es/wp-content/(.*)$ /wp-content/$1 last;
    }
    location ^~ /wp-content/ {
        alias /wp-es-content/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        error_page 404 = @es_wp_en;
    }
    location @es_wp_en {
        rewrite ^/wp-content/(.*)$ /$1 break;
        root /wp-en-content;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }
    location @en_wp_es {
        rewrite ^/en/wp-content/(.*)$ /$1 break;
        root /wp-es-content;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Legacy WordPress /en/* → English at site root. Extensionless only (no assets).
    # Use $http_host so :8088 is kept on the test server ($host strips the port).
    location = /en {
        return 301 $scheme://$http_host/$is_args$args;
    }
    location = /en/ {
        return 301 $scheme://$http_host/$is_args$args;
    }
    location ~ ^/en/([^.]*)$ {
        return 301 $scheme://$http_host/$1$is_args$args;
    }

    location ^~ /vote/api/users {
        proxy_pass http://api:4000/api/users;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $vote_client_ip;
        proxy_set_header X-Forwarded-For $vote_client_ip;
        proxy_set_header CF-Connecting-IP $vote_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires off;
        etag off;
    }

    location /vote/api/ {
        proxy_pass http://api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $vote_client_ip;
        proxy_set_header X-Forwarded-For $vote_client_ip;
        proxy_set_header CF-Connecting-IP $vote_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        etag off;
    }

    location /vote/uploads/ {
        proxy_pass http://api:4000/uploads/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $vote_client_ip;
        proxy_set_header X-Forwarded-For $vote_client_ip;
        proxy_set_header CF-Connecting-IP $vote_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /vote/socket.io/ {
        proxy_pass http://api:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $vote_client_ip;
        proxy_set_header X-Forwarded-For $vote_client_ip;
        proxy_set_header CF-Connecting-IP $vote_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /vote {
        return 301 $scheme://$http_host/vote/;
    }

    location = /vote/index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        etag off;
    }
    location = /vote/ {
        root /usr/share/nginx/html;
        rewrite ^ /vote/index.html break;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        etag off;
    }

    location ^~ /vote/user {
        root /usr/share/nginx/html;
        rewrite ^ /vote/index.html break;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        etag off;
    }
    location ^~ /vote/perfil {
        root /usr/share/nginx/html;
        rewrite ^ /vote/index.html break;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        etag off;
    }
    location ^~ /vote/profile {
        root /usr/share/nginx/html;
        rewrite ^ /vote/index.html break;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        etag off;
    }

    location ^~ /vote/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /vote/index.html;
    }

    location = /main-sitemap.xsl {
        default_type application/xml;
        add_header Content-Type "application/xml; charset=UTF-8";
    }

    location = /feed {
        rewrite ^ /api/news/feed last;
    }

    location = /feed/ {
        rewrite ^ /api/news/feed last;
    }

    location = /rss.xml {
        rewrite ^ /api/news/feed last;
    }

    location = /es/feed {
        rewrite ^ /api/news/feed/es last;
    }

    location = /es/feed/ {
        rewrite ^ /api/news/feed/es last;
    }

    location = /sitemap.xml {
        rewrite ^ /api/news/sitemaps/index last;
    }

    location = /sitemap_index.xml {
        rewrite ^ /api/news/sitemaps/index last;
    }

    location = /es/sitemap.xml {
        rewrite ^ /api/news/sitemaps/index/es last;
    }

    location = /es/sitemap_index.xml {
        rewrite ^ /api/news/sitemaps/index/es last;
    }

    location = /news-sitemap.xml {
        rewrite ^ /api/news/sitemaps/news last;
    }

    location = /es/news-sitemap.xml {
        rewrite ^ /api/news/sitemaps/news/es last;
    }

    location ~ ^/news-sitemap-(en|es)\.xml$ {
        rewrite ^/news-sitemap-(en|es)\.xml$ /api/news/sitemaps/news/$1 last;
    }

    location ~ ^/sitemap-([0-9]+)\.xml$ {
        rewrite ^/sitemap-([0-9]+)\.xml$ /api/news/sitemaps/en/$1 last;
    }

    location ~ ^/es/sitemap-([0-9]+)\.xml$ {
        rewrite ^/es/sitemap-([0-9]+)\.xml$ /api/news/sitemaps/es/$1 last;
    }

    location ~ ^/sitemap-en-([0-9]+)\.xml$ {
        return 301 $scheme://$http_host/sitemap-$1.xml;
    }

    location ~ ^/sitemap-es-([0-9]+)\.xml$ {
        return 301 $scheme://$http_host/es/sitemap-$1.xml;
    }

    location ~ ^/post-sitemap([0-9]+)\.xml$ {
        return 301 $scheme://$http_host/sitemap-$1.xml;
    }

    location ~ ^/en/post-sitemap([0-9]+)\.xml$ {
        return 301 $scheme://$http_host/sitemap-$1.xml;
    }

    location ~ ^/es/post-sitemap([0-9]+)\.xml$ {
        return 301 $scheme://$http_host/es/sitemap-$1.xml;
    }

    location ^~ /api/users {
        proxy_pass http://api:4000/api/users;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $vote_client_ip;
        proxy_set_header X-Forwarded-For $vote_client_ip;
        proxy_set_header CF-Connecting-IP $vote_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires off;
        etag off;
    }
    location ^~ /api/votes {
        proxy_pass http://api:4000/api/votes;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $vote_client_ip;
        proxy_set_header X-Forwarded-For $vote_client_ip;
        proxy_set_header CF-Connecting-IP $vote_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        etag off;
    }
    location ^~ /api/polls {
        proxy_pass http://api:4000/api/polls;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $vote_client_ip;
        proxy_set_header X-Forwarded-For $vote_client_ip;
        proxy_set_header CF-Connecting-IP $vote_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        etag off;
    }
    location ^~ /api/rankings {
        proxy_pass http://api:4000/api/rankings;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $vote_client_ip;
        proxy_set_header X-Forwarded-For $vote_client_ip;
        proxy_set_header CF-Connecting-IP $vote_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        etag off;
    }

    location = /api/news/home {
        proxy_pass http://api:4000/api/news/home;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $vote_client_ip;
        proxy_set_header X-Forwarded-For $vote_client_ip;
        proxy_set_header CF-Connecting-IP $vote_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        etag off;
    }
    location ^~ /api/admin {
        proxy_pass http://api:4000/api/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $vote_client_ip;
        proxy_set_header X-Forwarded-For $vote_client_ip;
        proxy_set_header CF-Connecting-IP $vote_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        etag off;
    }

    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $vote_client_ip;
        proxy_set_header X-Forwarded-For $vote_client_ip;
        proxy_set_header CF-Connecting-IP $vote_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://api:4000/uploads/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $vote_client_ip;
        proxy_set_header X-Forwarded-For $vote_client_ip;
        proxy_set_header CF-Connecting-IP $vote_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://api:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $vote_client_ip;
        proxy_set_header X-Forwarded-For $vote_client_ip;
        proxy_set_header CF-Connecting-IP $vote_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /forum { try_files /index.html =404; }
    location = /forum/ { try_files /index.html =404; }
    location ^~ /forum/ { try_files $uri /index.html; }
    location = /foro { return 301 /forum; }
    location = /foro/ { return 301 /forum; }
    location = /es/forum { try_files /index.html =404; }
    location = /es/forum/ { try_files /index.html =404; }
    location ^~ /es/forum/ { try_files $uri /index.html; }
    location = /es/foro { try_files /index.html =404; }
    location = /es/foro/ { try_files /index.html =404; }
    location ^~ /es/foro/ { try_files $uri /index.html; }

    location ~ ^/es/author/([A-Za-z0-9_-]+)/?$ {
        set $news_slug $1;
        proxy_intercept_errors on;
        error_page 404 = @news_spa;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $vote_client_ip;
        proxy_set_header X-Forwarded-For $vote_client_ip;
        proxy_set_header CF-Connecting-IP $vote_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api:4000/api/news/share-author/$news_slug?locale=es;
    }

    location ~ ^/author/([A-Za-z0-9_-]+)/?$ {
        set $news_slug $1;
        proxy_intercept_errors on;
        error_page 404 = @news_spa;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $vote_client_ip;
        proxy_set_header X-Forwarded-For $vote_client_ip;
        proxy_set_header CF-Connecting-IP $vote_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api:4000/api/news/share-author/$news_slug?locale=en;
    }

    # /es/nota → article HTML (OG + NewsArticle already in the document).
    location ~ ^/es/(?!admin$|perfil$|profile$|user$|author$|forum$|foro$|categoria$|categorias$|categories$|category$|kpop$|k-pop$|noticias$|viral$|pop$|series$|celebridades$|entretenimiento$|peliculas$|k-drama$|feed$|sitemap$)([A-Za-z0-9_-]+)/?$ {
        set $news_slug $1;
        proxy_intercept_errors on;
        error_page 404 = @news_spa;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $vote_client_ip;
        proxy_set_header X-Forwarded-For $vote_client_ip;
        proxy_set_header CF-Connecting-IP $vote_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api:4000/api/news/share/$news_slug?locale=es;
    }

    # Old Spanish URLs at root → /es/slug, only if the slug is Spanish and not English.
    # A blind /slug → /es/slug would 301 English articles and loop with /en/slug → /slug.
    location ~ ^/(?!es/?$|en/?$|vote/?$|api/?$|uploads/?$|images/?$|assets/?$|feed/?$|admin/?$|perfil/?$|profile/?$|user/?$|author/?$|forum/?$|foro/?$|categoria/?$|categorias/?$|categories/?$|category/?$|kpop/?$|k-pop/?$|noticias/?$|viral/?$|pop/?$|series/?$|celebridades/?$|entretenimiento/?$|peliculas/?$|k-drama/?$)([A-Za-z0-9_-]+)/?$ {
        set $news_slug $1;
        proxy_intercept_errors on;
        error_page 404 = @article_en;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $vote_client_ip;
        proxy_set_header X-Forwarded-For $vote_client_ip;
        proxy_set_header CF-Connecting-IP $vote_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api:4000/api/news/legacy-root/$news_slug;
    }

    location @article_en {
        proxy_intercept_errors on;
        error_page 404 = @news_spa;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $vote_client_ip;
        proxy_set_header X-Forwarded-For $vote_client_ip;
        proxy_set_header CF-Connecting-IP $vote_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api:4000/api/news/share/$news_slug?locale=en;
    }

    location @news_spa {
        try_files /index.html =404;
    }

    location ^~ /user/ {
        rewrite ^ /index.html break;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        etag off;
    }
    location ^~ /es/user {
        rewrite ^ /index.html break;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        etag off;
    }
    location ^~ /perfil {
        rewrite ^ /index.html break;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        etag off;
    }
    location ^~ /es/perfil {
        rewrite ^ /index.html break;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        etag off;
    }
    location ^~ /profile {
        rewrite ^ /index.html break;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        etag off;
    }
    location ^~ /es/profile {
        rewrite ^ /index.html break;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        etag off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
