name: new_musicmundial

services:
  postgres:
    image: postgres:16-alpine
    container_name: nmm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nmm_vote}
      POSTGRES_USER: ${POSTGRES_USER:-nmm_vote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - nmm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nmm_vote} -d ${POSTGRES_DB:-nmm_vote}"]
      interval: 8s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5433:5432"

  mysql-proxy:
    image: alpine/socat
    container_name: nmm-mysql-proxy
    restart: unless-stopped
    network_mode: host
    command: TCP-LISTEN:3309,bind=172.17.0.1,fork,reuseaddr TCP-CONNECT:127.0.0.1:3306

  redis:
    image: redis:7-alpine
    container_name: nmm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - nmm-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 8s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      target: build
    image: nmm-api-build:latest
    env_file: .env
    command: npx prisma db push --skip-generate
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      target: runtime
    image: nmm-api:latest
    container_name: nmm-api
    restart: unless-stopped
    env_file: .env
    command: node dist/main.js
    volumes:
      - ./uploads:/app/uploads
      - ./html:/app/news-html:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql-proxy:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  worker:
    image: nmm-api:latest
    container_name: nmm-worker
    restart: unless-stopped
    env_file: .env
    command: node dist/workers/main.js
    volumes:
      - ./uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: nmm-nginx
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./html:/usr/share/nginx/html:ro
      - /www/wwwroot/musicmundial.com/wp-content:/wp-es-content:ro
      - /www/wwwroot/musicmundial.com/en/wp-content:/wp-en-content:ro
    depends_on:
      - api

volumes:
  nmm-postgres-data:
  nmm-redis-data:
