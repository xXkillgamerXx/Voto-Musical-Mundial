# Include from the Music Mundial Apache/OpenLiteSpeed vhost (or paste these lines).
# Serves a friendly page when the Docker/nginx upstream on :8088 is restarting.
#
# Requires the static file at the site document root:
#   /www/wwwroot/new_musicmundial/html/maintenance.html

ProxyErrorOverride On
ProxyPass /maintenance.html !
ProxyPassReverse /maintenance.html !
ErrorDocument 500 /maintenance.html
ErrorDocument 502 /maintenance.html
ErrorDocument 503 /maintenance.html
ErrorDocument 504 /maintenance.html
