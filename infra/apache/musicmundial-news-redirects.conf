# Music Mundial URL migration (WordPress → CMS)
# Use this on Apache hosts (aaPanel / www.musicmundial.com).
# The live new-CMS stack on 161 uses Nginx: deploy/new_musicmundial/nginx/default.conf
#
# /en/slug  → /slug          (old English)
# /slug     → /es/slug       (old Spanish, only via API so English root URLs are not redirected)

RewriteEngine On

# --- English: /en and /en/anything (no file extension) → root ---
RewriteRule ^en/?$ / [R=301,L,QSA]
RewriteCond %{REQUEST_URI} !\.[a-zA-Z0-9]{1,8}$
RewriteRule ^en/(.*)$ /$1 [R=301,L,QSA]

# --- Sitemaps: English at root is sitemap-1.xml (not sitemap-en-1.xml) ---
RewriteRule ^sitemap-en-([0-9]+)\.xml$ /sitemap-$1.xml [R=301,L]
RewriteRule ^sitemap-es-([0-9]+)\.xml$ /es/sitemap-$1.xml [R=301,L]
RewriteRule ^post-sitemap([0-9]+)\.xml$ /sitemap-$1.xml [R=301,L]
RewriteRule ^en/post-sitemap([0-9]+)\.xml$ /sitemap-$1.xml [R=301,L]
RewriteRule ^es/post-sitemap([0-9]+)\.xml$ /es/sitemap-$1.xml [R=301,L]

# --- Spanish: do not use a blind /slug → /es/slug on this vhost ---
# That would 301 English articles and chain /en/slug → /slug → /es/slug.
# Nginx on 161 checks MySQL (EN exists → stay; ES-only → 301 /es/slug).
# If this Apache vhost also serves the new CMS, copy that lookup from
# deploy/new_musicmundial/nginx/default.conf rather than uncommenting below.
#
# RewriteCond %{REQUEST_FILENAME} !-f
# RewriteCond %{REQUEST_URI} !\.[a-zA-Z0-9]{1,8}$
# RewriteRule ^([A-Za-z0-9_-]+)/?$ /es/$1 [R=301,L]
