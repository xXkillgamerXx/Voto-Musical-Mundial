ProxyPreserveHost On

<LocationMatch "^/backend(/.*)?$">
    Require all denied
</LocationMatch>

ProxyPass /api/ http://127.0.0.1:4000/api/
ProxyPassReverse /api/ http://127.0.0.1:4000/api/

# Socket.IO needs HTTP proxy for polling and websocket upgrade.
ProxyPass /socket.io/ http://127.0.0.1:4000/socket.io/
ProxyPassReverse /socket.io/ http://127.0.0.1:4000/socket.io/

# Social crawlers need poll OG tags (banner image) before the SPA boots.
RewriteEngine On
RewriteCond %{HTTP_USER_AGENT} (facebookexternalhit|Facebot|Twitterbot|WhatsApp|TelegramBot|Slackbot|LinkedInBot|Discordbot|Pinterest|SkypeUriPreview|vkShare|Applebot|Google.*snippet) [NC]
RewriteRule ^(?:en/)?(?:votacion|poll)/([0-9]+)/([^/]+)/?$ /api/share/poll/$1/$2 [P,L]
