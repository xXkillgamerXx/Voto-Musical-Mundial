<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Certificado de ganador — Music Mundial VOTING</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 100%;
        height: 100%;
        background: #07070d;
        font-family: Inter, Arial, sans-serif;
        color: #fff;
      }

      body {
        display: grid;
        place-items: center;
        padding: 16px;
      }

      html.embedded,
      html.embedded body {
        height: auto;
        min-height: 0;
        background: transparent;
        padding: 0;
      }

      html.embedded body {
        display: block;
      }

      .cert {
        position: relative;
        width: 100%;
        max-width: 500px;
        aspect-ratio: 3 / 3.85;
        border-radius: 22px;
        overflow: hidden;
        border: 1px solid #4c1d95;
        box-shadow: 0 24px 80px rgba(88, 28, 180, 0.38);
        background: #070314 url("/certificate-bg.jpg") center / cover no-repeat;
        container-type: inline-size;
      }

      html.embedded .cert {
        max-width: none;
        border-radius: 0;
        border: 0;
        box-shadow: none;
      }

      .cert::before {
        content: "";
        position: absolute;
        inset: 13px;
        border-radius: 16px;
        border: 1px solid rgba(196, 181, 253, 0.28);
        pointer-events: none;
        z-index: 2;
      }

      .glow {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(90% 40% at 50% -5%, rgba(124, 58, 237, 0.32), transparent 58%),
          radial-gradient(70% 35% at 100% 70%, rgba(88, 28, 135, 0.22), transparent 60%);
      }

      .inner {
        position: relative;
        z-index: 3;
        height: 100%;
        padding: 6% 7% 5%;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .crown-top {
        width: 23.6%;
        height: auto;
        display: block;
        mix-blend-mode: lighten;
        filter: drop-shadow(0 6px 14px rgba(245, 197, 66, 0.28));
      }

      .brand {
        margin-top: 6px;
        font-size: clamp(10px, 2.6cqw, 13px);
        letter-spacing: 3.6px;
        font-weight: 800;
        color: #f5f3ff;
      }

      .voting {
        margin-top: 3px;
        font-size: clamp(8px, 2cqw, 10px);
        letter-spacing: 4.2px;
        font-weight: 700;
        color: #c084fc;
      }

      .title-row {
        margin-top: 4.4%;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .title-row svg {
        width: clamp(14px, 4cqw, 20px);
        height: clamp(14px, 4cqw, 20px);
        flex-shrink: 0;
      }

      .title-row h1 {
        font-family: Cinzel, Georgia, serif;
        font-weight: 700;
        font-size: clamp(18px, 5.6cqw, 28px);
        letter-spacing: 3.5px;
        color: #f8f7ff;
      }

      .spark-line {
        margin-top: 2.4%;
        color: #c084fc;
        font-size: clamp(9px, 2.2cqw, 11px);
        letter-spacing: 6px;
      }

      .certifies {
        margin-top: 2%;
        font-size: clamp(9px, 2.2cqw, 11px);
        letter-spacing: 2.1px;
        color: #d8b4fe;
        font-weight: 600;
      }

      .winner {
        margin-top: 2.8%;
        font-family: Cinzel, Georgia, serif;
        font-weight: 800;
        font-size: clamp(22px, 8.4cqw, 44px);
        letter-spacing: 0.5px;
        line-height: 1.05;
        background: linear-gradient(180deg, #ffffff 8%, #f3e8ff 40%, #c084fc 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        max-width: 100%;
        word-break: break-word;
      }

      .group {
        margin-top: 2%;
        font-size: clamp(12px, 3.2cqw, 16px);
        letter-spacing: 7px;
        font-weight: 700;
        color: #ede9fe;
      }

      .awarded {
        margin-top: 4.4%;
        font-size: clamp(9px, 2.2cqw, 11px);
        letter-spacing: 2.6px;
        color: #a1a1aa;
        font-weight: 600;
      }

      .award-box {
        margin-top: 2.8%;
        width: 88%;
        padding: 3.2% 2.8% 2.4%;
        border: 1px solid rgba(233, 213, 255, 0.38);
        border-radius: 10px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(88, 28, 135, 0.18));
      }

      .award-box .award {
        font-family: Cinzel, Georgia, serif;
        font-weight: 700;
        font-size: clamp(12px, 3.6cqw, 18px);
        letter-spacing: 1.5px;
        color: #fff;
        word-break: break-word;
      }

      .award-box .year {
        margin-top: 7px;
        font-size: clamp(11px, 2.8cqw, 14px);
        letter-spacing: 3px;
        color: #e9d5ff;
        font-weight: 600;
      }

      .spark { color: #c084fc; font-size: 0.75em; }

      .desc {
        margin-top: 4%;
        max-width: 88%;
        font-size: clamp(11px, 2.6cqw, 13px);
        line-height: 1.6;
        color: #c4c4d0;
      }

      .desc em {
        display: block;
        margin-top: 8px;
        font-style: italic;
        color: #a1a1aa;
        font-size: 0.92em;
      }

      .foot {
        width: 100%;
        margin-top: auto;
        padding-top: 3.6%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: clamp(8px, 2cqw, 10px);
        color: #a1a1aa;
      }

      .foot .mid,
      .foot .hash { color: #c084fc; }
    </style>
  </head>
  <body>
    <article class="cert" id="certificate" aria-label="Music Mundial Certificate">
      <div class="glow"></div>
      <div class="inner">
        <img class="crown-top" src="/certificate-crown.png" alt="" width="118" height="100" />

        <div class="brand">MUSIC MUNDIAL</div>
        <div class="voting">VOTING</div>

        <div class="title-row">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#e9d5ff" d="M12 1.6l2.05 6.3H21l-5.2 3.78 1.98 6.32L12 14.9 6.22 18l1.98-6.32L3 7.9h6.95L12 1.6z" />
          </svg>
          <h1 id="out-title">CERTIFICATE</h1>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#e9d5ff" d="M12 1.6l2.05 6.3H21l-5.2 3.78 1.98 6.32L12 14.9 6.22 18l1.98-6.32L3 7.9h6.95L12 1.6z" />
          </svg>
        </div>

        <div class="spark-line">✦</div>
        <div class="certifies" id="out-certifies">MUSIC MUNDIAL CERTIFIES THAT</div>
        <div class="winner" id="out-name">JUNGKOOK</div>
        <div class="group" id="out-group">BTS</div>
        <div class="awarded" id="out-awarded">HAS BEEN OFFICIALLY AWARDED</div>

        <div class="award-box">
          <div class="award" id="out-category">ARTIST OF THE YEAR</div>
          <div class="year" id="out-year"><span class="spark">✦</span> 2026 <span class="spark">✦</span></div>
        </div>

        <p class="desc" id="out-desc">
          In recognition of outstanding talent, dedication<br />
          and impact in the music industry.
          <em>Voted by fans worldwide.</em>
        </p>

        <div class="foot">
          <span>◆ vote.musicmundial.com</span>
          <span class="mid">✦</span>
          <span class="hash" id="out-hash">#MusicMundialAwards2026</span>
        </div>
      </div>
    </article>

    <script>
      const params = new URLSearchParams(window.location.search);
      const lang = params.get("lang") === "en" ? "en" : "es";
      document.documentElement.lang = lang;

      if (window.self !== window.top) {
        document.documentElement.classList.add("embedded");
      }

      const copy = {
        es: {
          title: "CERTIFICADO",
          certifies: "MUSIC MUNDIAL CERTIFICA QUE",
          awarded: "HA SIDO OFICIALMENTE PREMIADO/A",
          descHtml:
            "En reconocimiento a su talento excepcional, dedicación<br>e impacto en la industria musical." +
            "<em>Votado por fans de todo el mundo.</em>",
        },
        en: {
          title: "CERTIFICATE",
          certifies: "MUSIC MUNDIAL CERTIFIES THAT",
          awarded: "HAS BEEN OFFICIALLY AWARDED",
          descHtml:
            "In recognition of outstanding talent, dedication<br>and impact in the music industry." +
            "<em>Voted by fans worldwide.</em>",
        },
      }[lang];

      const setText = (id, value, fallback = "") => {
        const el = document.getElementById(id);
        if (!el) return;
        const text = String(value ?? fallback ?? "").trim();
        el.textContent = text || "\u00a0";
        if (id === "out-group") {
          el.style.display = text ? "block" : "none";
        }
      };

      const name = params.get("name") || "JUNGKOOK";
      const group = params.get("group") || "";
      const category = params.get("category") || "ARTIST OF THE YEAR";
      const yearRaw = String(params.get("year") || new Date().getFullYear()).trim();
      const year = /^\d{4}$/.test(yearRaw) ? yearRaw : String(new Date().getFullYear());

      document.getElementById("out-title").textContent = copy.title;
      document.getElementById("out-certifies").textContent = copy.certifies;
      document.getElementById("out-awarded").textContent = copy.awarded;
      document.getElementById("out-desc").innerHTML = copy.descHtml;

      setText("out-name", name.toUpperCase());
      setText("out-group", group.toUpperCase());
      setText("out-category", category.toUpperCase());
      document.getElementById("out-year").innerHTML =
        `<span class="spark">✦</span> ${year} <span class="spark">✦</span>`;
      document.getElementById("out-hash").textContent = `#MusicMundialAwards${year}`;
    </script>
  </body>
</html>
